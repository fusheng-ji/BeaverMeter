name: Release BeaverMeter
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to test and publish (defaults to the workflow ref)
        type: string
        default: ''
      publish_uploaded_assets:
        description: Publish an existing locally signed draft after validation
        type: boolean
        default: false
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'push' || github.event.deleted == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - run: brew install xcodegen ripgrep
      - name: Verify selected Swift toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - run: python3 scripts/release_metadata.py --tag "$RELEASE_TAG"
      - name: Configure shader compilation for the Intel virtual GPU
        if: matrix.os == 'macos-15-intel'
        run: |
          # Avoid RenderBox's precompiled shader archive on the virtual Metal device.
          # Keep every ImageRenderer pixel assertion and normal Metal error handling.
          echo 'RB_USE_BINARY_ARCHIVE=0' >> "$GITHUB_ENV"
          echo 'TEST_RUNNER_RB_USE_BINARY_ARCHIVE=0' >> "$GITHUB_ENV"
      - run: zsh scripts/test.sh
  package:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Select signing route
        id: route
        env:
          SIGNING_KEY_AVAILABLE: ${{ secrets.BEAVERMETER_SPARKLE_PRIVATE_KEY != '' }}
          PUBLISH_UPLOADED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_uploaded_assets }}
        shell: bash
        run: |
          if [[ "$PUBLISH_UPLOADED" == true ]]; then
            echo 'mode=uploaded' >> "$GITHUB_OUTPUT"
          elif [[ "$SIGNING_KEY_AVAILABLE" == true ]]; then
            echo 'mode=build' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=pending' >> "$GITHUB_OUTPUT"
            echo 'Tests passed. No release was published: build and sign locally, upload the five draft assets, then dispatch this workflow with release_tag set to the immutable tag and publish_uploaded_assets=true.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.route.outputs.mode == 'build'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/packaging/package-lock.json
      - if: steps.route.outputs.mode == 'build'
        run: brew install xcodegen
      - if: steps.route.outputs.mode != 'pending'
        run: xcodebuild -version
      - name: Build universal DMG and signed appcast
        if: steps.route.outputs.mode == 'build'
        env:
          BEAVERMETER_SPARKLE_PRIVATE_KEY: ${{ secrets.BEAVERMETER_SPARKLE_PRIVATE_KEY }}
        run: zsh scripts/build_release.sh "$RUNNER_TEMP/release" "$RELEASE_TAG"
      - name: Upload built draft assets
        if: steps.route.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Refusing to replace a published release"' "$RUNNER_TEMP/release-state.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "BeaverMeter $version" --notes-file "$RUNNER_TEMP/release/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/BeaverMeter-${version}-universal.dmg" \
            "$RUNNER_TEMP/release/BeaverMeter-${version}-source.zip" \
            "$RUNNER_TEMP/release/appcast.xml" \
            "$RUNNER_TEMP/release/release-notes.md" \
            "$RUNNER_TEMP/release/SHA256SUMS" --clobber
      - name: Verify uploaded draft assets, then publish
        if: steps.route.outputs.mode != 'pending'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python3 scripts/release_metadata.py --tag "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json isDraft,tagName > "$RUNNER_TEMP/release-state.json"
          python3 -c 'import json,sys; state=json.load(open(sys.argv[1])); assert state["isDraft"] and state["tagName"] == sys.argv[2], "Expected the exact-tag draft release"' "$RUNNER_TEMP/release-state.json" "$RELEASE_TAG"
          # Downloads the actual uploaded bytes with draft authorization. Public-key verification
          # needs no signing secret and checks all five names, every checksum and every signature.
          mkdir "$RUNNER_TEMP/uploaded-release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/uploaded-release"
          python3 scripts/release_metadata.py --artifacts "$RUNNER_TEMP/uploaded-release"
          python3 scripts/release_metadata.py --dmg "$RUNNER_TEMP/uploaded-release/BeaverMeter-${version}-universal.dmg"
          python3 scripts/verify_release_source.py "$RUNNER_TEMP/uploaded-release/BeaverMeter-${version}-source.zip" "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/uploaded-release/release-notes.md" --draft=false --latest
