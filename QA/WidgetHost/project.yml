name: BeaverMeterWidgetQA
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  BeaverMeterWidgetQA:
    type: application
    platform: macOS
    sources:
      - path: Host
      - path: Common
      - path: ../../Shared
        excludes:
          - UsageSnapshotStore.swift
          - DeepSeekCredentialStore.swift
    info:
      path: Generated/Host-Info.plist
      properties:
        CFBundleDisplayName: BeaverMeter QA
        CFBundleURLTypes:
          - CFBundleURLName: com.jiwenbo.beavermeter.widgetqa
            CFBundleURLSchemes:
              - com.jiwenbo.beavermeter.widgetqa
        BeaverMeterMenuURLScheme: com.jiwenbo.beavermeter.widgetqa
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiwenbo.beavermeter.widgetqa
        PRODUCT_NAME: BeaverMeter QA
    dependencies:
      - target: BeaverMeterWidgetQAExtension
        embed: true
  BeaverMeterWidgetQAExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
      - path: Common
      - path: ../../Shared
        excludes:
          - UsageSnapshotStore.swift
          - DeepSeekCredentialStore.swift
      - path: ../../Widget
        excludes:
          - BeaverMeterWidget.swift
          - BeaverMeterWidgetView.swift
          - WidgetPreviews.swift
          - WidgetModuleIntent.swift
      - path: ../../Design/ProviderAssets
        type: folder
        buildPhase: resources
    info:
      path: Generated/Extension-Info.plist
      properties:
        CFBundleDisplayName: BeaverMeter QA
        BeaverMeterMenuURLScheme: com.jiwenbo.beavermeter.widgetqa
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiwenbo.beavermeter.widgetqa.widget
        PRODUCT_NAME: BeaverMeterWidgetQAExtension
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Extension/WidgetQA.entitlements
schemes:
  BeaverMeterWidgetQA:
    build:
      targets:
        BeaverMeterWidgetQA: all
        BeaverMeterWidgetQAExtension: all
